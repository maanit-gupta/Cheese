name: Cheese

options:
  bundleIdPrefix: com.maanitgupta
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Cheese has no App Intents; skip Xcode's metadata extraction step, which otherwise
    # warns "Metadata extraction skipped, no AppIntents.framework dependency found".
    LM_SKIP_METADATA_EXTRACTION: YES
    # One version for the app and its Finder extension, which must match.
    MARKETING_VERSION: "2.1.1"
    CURRENT_PROJECT_VERSION: 9
    # Stable signing keeps Screen Recording / Accessibility grants across rebuilds.
    # The author's personal team: the OU of the Apple Development certificate (not the ID in its name).
    DEVELOPMENT_TEAM: 8H5274FWRC
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

targets:
  Cheese:
    type: application
    platform: macOS
    sources:
      - path: Cheese
        excludes: [Resources/Renderers, Info.plist, Cheese.entitlements]
      # Folder reference: the vendored renderers keep their layout under Renderers/ in the bundle,
      # so office.html can load its scripts by relative path.
      - path: Cheese/Resources/Renderers
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - target: CheeseFinderExtension
      - target: CheeseShareExtension
    # Merged with the generated Info.plist keys below.
    info:
      path: Cheese/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.maanitgupta.cheese
            CFBundleURLSchemes: [cheese]
        # The Finder extension hands jobs over through this team-prefixed group; no profile needed on macOS.
        CheeseAppGroup: $(TeamIdentifierPrefix)com.maanitgupta.cheese
    entitlements:
      path: Cheese/Cheese.entitlements
      properties:
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.maanitgupta.cheese]
    settings:
      base:
        PRODUCT_NAME: Cheese
        PRODUCT_BUNDLE_IDENTIFIER: com.maanitgupta.cheese
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cheese
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Maanit Gupta. MIT License."
        # Asked once, when the command palette uses the current Finder selection for a Files tool.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Cheese reads the files selected in Finder so Files tools can work on them. Office apps are asked to save as PDF only if you turn that on in Settings."
        # Asked the first time Cheese Share looks for nearby devices.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Cheese Share finds phones and computers on your network running LocalSend, and lets them send files and text to this Mac."
        # Not sandboxed: Accessibility and posted CGEvents don't work inside the sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

  # Finder's right-click "Cheese ▸" submenu. Sandboxed, as Finder Sync requires; it only builds the
  # menu and hands the job to the app through the App Group, with no tool logic of its own.
  CheeseFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - CheeseFinderExtension
      - Cheese/Files/Core/ToolID.swift
      - Cheese/Files/Core/ToolApplicability.swift
      - Cheese/Files/Core/FilesHandoff.swift
    info:
      path: CheeseFinderExtension/Info.plist
      properties:
        CFBundleDisplayName: Cheese
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CheeseAppGroup: $(TeamIdentifierPrefix)com.maanitgupta.cheese
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: CheeseFinderExtension/CheeseFinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.maanitgupta.cheese]
    settings:
      base:
        PRODUCT_NAME: CheeseFinderExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.maanitgupta.cheese.FinderExtension
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  # "Cheese Share" in the macOS Share menu. Sandboxed; it copies what it's given into the App Group
  # and hands it to the app, with no sharing logic of its own.
  CheeseShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - CheeseShareExtension
      - Cheese/Files/Core/ToolID.swift
      - Cheese/Files/Core/ToolApplicability.swift
      - Cheese/Files/Core/FilesHandoff.swift
      - Cheese/Share/ShareHandoff.swift
    info:
      path: CheeseShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Cheese Share
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CheeseAppGroup: $(TeamIdentifierPrefix)com.maanitgupta.cheese
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 100
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
    entitlements:
      path: CheeseShareExtension/CheeseShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.maanitgupta.cheese]
    settings:
      base:
        PRODUCT_NAME: CheeseShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.maanitgupta.cheese.ShareExtension
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  CheeseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CheeseTests
        excludes: [Fixtures]
      # Folder reference: fixtures land in the test bundle under Fixtures/.
      - path: CheeseTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Cheese
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maanitgupta.cheese.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cheese.app/Contents/MacOS/Cheese
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Cheese:
    build:
      targets:
        Cheese: all
        CheeseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CheeseTests]
