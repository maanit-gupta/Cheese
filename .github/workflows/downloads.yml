name: Update download count

on:
  schedule:
    - cron: "17 */6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Count Cheese.zip downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq '[.[].assets[] | select(.name == "Cheese.zip") | .download_count] | add // 0' \
            | paste -sd+ - | bc)
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"FFC83D"}\n' "$total" > docs/downloads.json
          cat docs/downloads.json
      - name: Commit if changed
        run: |
          git diff --quiet -- docs/downloads.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads.json
          git commit -m "Update download count"
          git push origin HEAD:main
