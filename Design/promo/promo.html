<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cheese Promo</title>
<style>
  :root {
    --cheese: #FFC83D;
    --cheese-deep: #F29E1F;
    --ink: #1d1d1f;
    --paper: #fbfaf7;
    --muted: #8a8a8e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #0e0d12;
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(900px 700px at 18% 30%, rgba(255,200,61,0.16), transparent 70%),
      radial-gradient(1100px 800px at 85% 90%, rgba(242,158,31,0.12), transparent 70%),
      linear-gradient(160deg, #15131b 0%, #0d0c11 100%);
  }
  .layer { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; }

  /* ---------- Intro / outro ---------- */
  .center-col { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .big-icon { width: 300px; height: 300px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.55)); }
  .wordmark { font-size: 132px; font-weight: 800; letter-spacing: -4px; margin-top: 8px; }
  .tagline { font-size: 40px; font-weight: 500; color: #c9c6cf; margin-top: 10px; letter-spacing: -0.5px; }
  .pills { display: flex; gap: 16px; margin-top: 42px; }
  .pill { font-size: 26px; font-weight: 600; padding: 12px 24px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: #e9e6ee; }
  .pill.y { background: var(--cheese); color: #2a1d00; border-color: transparent; }
  .term { margin-top: 44px; font: 500 26px "SF Mono", Menlo, monospace; background: #000; border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 22px 30px; color: #e8e8e8; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .term .p { color: var(--cheese); }
  .url { margin-top: 26px; font-size: 30px; color: #c9c6cf; font-weight: 500; }

  /* ---------- Left caption panel ---------- */
  .panel { position: absolute; left: 110px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; opacity: 0; }
  .panel .num { font: 700 24px "SF Mono", Menlo, monospace; color: var(--cheese); letter-spacing: 2px; }
  .panel h2 { font-size: 74px; font-weight: 800; letter-spacing: -2.5px; line-height: 1.02; margin-top: 18px; }
  .panel p { font-size: 30px; line-height: 1.35; color: #bdb9c6; margin-top: 22px; font-weight: 450; }
  .keys { display: flex; gap: 10px; margin-top: 34px; flex-wrap: wrap; }
  .key { min-width: 64px; height: 64px; padding: 0 16px; border-radius: 14px; background: linear-gradient(#2c2a33, #1f1d25); border: 1px solid rgba(255,255,255,.14); border-bottom-width: 4px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 600; color: #fff; }
  .keys .plus { align-self: center; color: #6f6b78; font-size: 28px; }

  /* ---------- Mock screen ---------- */
  #screen { position: absolute; left: 720px; top: 180px; width: 1100px; height: 720px; border-radius: 22px; overflow: hidden; opacity: 0;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 50px 120px rgba(0,0,0,.65);
    background:
      radial-gradient(600px 500px at 80% 85%, rgba(255,200,61,.55), transparent 70%),
      radial-gradient(700px 600px at 10% 10%, rgba(120,90,220,.55), transparent 70%),
      linear-gradient(135deg, #3b2a6b 0%, #8a3d6b 55%, #e08a3a 100%);
  }
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: rgba(30,20,40,.35); backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 16px; font-size: 14px; font-weight: 500; color: #fff; gap: 20px; z-index: 50; }
  .menubar .sp { flex: 1; }
  .menubar b { font-weight: 700; }
  .mb-cheese { width: 26px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 5px; }
  .mb-cheese.on { background: rgba(255,255,255,.3); }
  .mb-cheese svg { width: 20px; height: 20px; color: #fff; }

  .win { position: absolute; background: var(--paper); border-radius: 12px; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 22px 50px rgba(0,0,0,.35); overflow: hidden; color: var(--ink); }
  .win .tb { height: 38px; background: #ecebe8; border-bottom: 1px solid #dddcd8; display: flex; align-items: center; padding: 0 14px; gap: 8px; font-size: 14px; font-weight: 600; color: #4a4a4e; }
  .dots { display: flex; gap: 8px; margin-right: 10px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; display: block; }
  .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .win .body { padding: 22px 26px; font-size: 17px; line-height: 1.55; }

  .hud { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); display: flex; gap: 8px; padding: 12px 16px; border-radius: 18px; background: rgba(20,18,26,.82); backdrop-filter: blur(18px); box-shadow: 0 12px 40px rgba(0,0,0,.4); z-index: 80; opacity: 0; }
  .hud .key { min-width: 54px; height: 54px; font-size: 26px; border-radius: 12px; }

  .toast { position: absolute; left: 50%; bottom: 44px; display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-radius: 16px; background: rgba(28,26,34,.9); backdrop-filter: blur(16px); color: #fff; font-size: 19px; font-weight: 600; box-shadow: 0 14px 40px rgba(0,0,0,.4); z-index: 70; opacity: 0; white-space: nowrap; }
  .toast .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--cheese); color: #2a1d00; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .toast .btn { margin-left: 8px; padding: 5px 14px; background: rgba(255,255,255,.16); border-radius: 8px; font-size: 16px; }

  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.38); opacity: 0; z-index: 60; }
  .sel { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.38); z-index: 61; opacity: 0; }
  .sel .lbl { position: absolute; right: -2px; bottom: -34px; background: rgba(20,18,26,.85); color: #fff; font: 600 13px "SF Mono", Menlo, monospace; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
  .cursor { position: absolute; z-index: 90; width: 26px; height: 26px; opacity: 0; pointer-events: none; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 95; }

  /* clipboard popover */
  .pop { position: absolute; width: 660px; height: 430px; top: 40px; left: 360px; border-radius: 14px; background: #f7f6f3; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 30px 70px rgba(0,0,0,.4); color: var(--ink); transform-origin: 590px 0; display: flex; flex-direction: column; overflow: hidden; z-index: 40; opacity: 0; }
  .search { margin: 14px; height: 40px; border-radius: 10px; background: #ebe9e4; display: flex; align-items: center; padding: 0 14px; font-size: 17px; gap: 10px; color: #333; }
  .search .ph { color: #9a9a9e; }
  .caret { width: 2px; height: 20px; background: #0a64d8; display: inline-block; vertical-align: middle; }
  .cols { flex: 1; display: flex; border-top: 1px solid #e3e1dc; min-height: 0; }
  .list { width: 290px; border-right: 1px solid #e3e1dc; padding: 8px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 15px; white-space: nowrap; overflow: hidden; }
  .row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row .n { color: #9a9a9e; font-size: 13px; }
  .row.on { background: #0a64d8; color: #fff; }
  .row.on .n { color: rgba(255,255,255,.75); }
  .row .ri { width: 26px; height: 26px; border-radius: 6px; background: #e7e4dd; display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
  .row.on .ri { background: rgba(255,255,255,.22); }
  .preview { flex: 1; padding: 20px 22px; font-size: 16px; line-height: 1.55; color: #333; }
  .preview .meta { font-size: 13px; color: #9a9a9e; margin-top: 16px; }
  .mark { background: rgba(255,200,61,.55); border-radius: 3px; }

  /* report window (screenshot scene) */
  .bars { display: flex; align-items: flex-end; gap: 18px; height: 230px; padding: 10px 6px 0; border-bottom: 2px solid #e2dfd8; }
  .bars div { flex: 1; border-radius: 8px 8px 0 0; }
  .line { height: 12px; border-radius: 6px; background: #e6e3dc; margin-top: 14px; }

  .editor { position: absolute; left: 150px; top: 90px; width: 800px; height: 540px; z-index: 75; opacity: 0; }
  .tools { display: flex; gap: 6px; align-items: center; }
  .tool { width: 34px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #444; }
  .tool.on { background: #d9d6cf; }
  .ebtn { padding: 5px 14px; border-radius: 7px; background: #e1ded8; font-size: 13px; font-weight: 600; color: #333; }
  .ebtn.primary { background: #0a64d8; color: #fff; }

  /* OCR */
  .doc p { margin-bottom: 14px; }
  .w { border-radius: 3px; }
  .w.hit { background: rgba(255,200,61,.6); }
  .scanline { position: absolute; height: 3px; background: linear-gradient(90deg, transparent, var(--cheese), transparent); box-shadow: 0 0 18px var(--cheese); z-index: 62; opacity: 0; }

  /* scroll capture */
  .page { position: absolute; left: 0; right: 0; top: 0; }
  .navbar { height: 52px; background: #1d1d1f; color: #fff; display: flex; align-items: center; padding: 0 18px; gap: 16px; font-size: 14px; font-weight: 600; }
  .navbar .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--cheese); }
  .card { margin: 16px 18px; border-radius: 12px; padding: 16px; color: #fff; font-weight: 700; font-size: 18px; }
  .card .l { height: 9px; border-radius: 5px; background: rgba(255,255,255,.45); margin-top: 10px; }
  .stitch { position: absolute; overflow: hidden; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15), 0 20px 50px rgba(0,0,0,.4); }

  /* settings */
  .tabs { display: flex; justify-content: center; gap: 4px; padding: 10px 0 12px; border-bottom: 1px solid #dddcd8; background: #ecebe8; }
  .tab { width: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #555; padding: 6px 0; border-radius: 8px; }
  .tab .g { font-size: 20px; }
  .tab.on { background: #d9d6cf; color: #111; }
  .srow { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; font-size: 15px; border-bottom: 1px solid #ebe9e4; }
  .srow:last-child { border-bottom: none; }
  .rec { min-width: 118px; height: 30px; border-radius: 8px; background: #fff; border: 1px solid #d3d0c9; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #222; }
  .rec.recording { border: 2px solid #0a64d8; color: #0a64d8; }
  .group { margin: 0 22px; background: #fff; border-radius: 10px; border: 1px solid #e3e1dc; }
  .gtitle { font-size: 12px; font-weight: 700; color: #8a8a8e; margin: 14px 26px 6px; text-transform: uppercase; letter-spacing: .5px; }
  .menu { position: absolute; width: 270px; top: 34px; left: 700px; border-radius: 10px; background: rgba(246,245,242,.97); box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 20px 50px rgba(0,0,0,.4); color: var(--ink); padding: 6px; font-size: 14px; z-index: 45; opacity: 0; }
  .mi { display: flex; justify-content: space-between; padding: 5px 10px; border-radius: 6px; }
  .mi span:last-child { color: #8a8a8e; }
  .mi.on { background: #0a64d8; color: #fff; }
  .mi.on span:last-child { color: rgba(255,255,255,.8); }
  .msep { height: 1px; background: #dddcd8; margin: 5px 8px; }
</style>
</head>
<body>
<div id="stage">

  <!-- Intro -->
  <div class="layer" id="intro">
    <div class="center-col">
      <img class="big-icon" id="introIcon" src="../../Cheese/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png">
      <div class="wordmark" id="introWord">Cheese</div>
      <div class="tagline" id="introTag">Five everyday Mac tools. One tiny menu bar app.</div>
    </div>
  </div>

  <!-- Caption panels (one per feature scene) -->
  <div id="panels"></div>

  <!-- Shared mock screen -->
  <div id="screen">
    <div class="menubar">
      <b></b><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span>
      <span class="sp"></span>
      <span class="mb-cheese" id="mbCheese"><svg viewBox="0 0 18 18"><path fill-rule="evenodd" fill="currentColor" d="M 3.2 13.5 C 2.6 13.5 2.2 12.9 2.4 12.3 L 5.1 4.5 C 5.3 3.9 6.0 3.5 6.6 3.6 L 14.8 5.2 C 15.5 5.3 15.9 6.0 15.7 6.7 L 14.3 12.5 C 14.1 13.1 13.5 13.5 12.9 13.5 Z M 6.8 7.2 A 1.2 1.2 0 1 0 6.8 9.6 A 1.2 1.2 0 1 0 6.8 7.2 Z M 11.2 6.5 A 1.0 1.0 0 1 0 11.2 8.5 A 1.0 1.0 0 1 0 11.2 6.5 Z M 10.5 10.2 A 1.4 1.4 0 1 0 10.5 13.0 A 1.4 1.4 0 1 0 10.5 10.2 Z"/></svg></span>
      <span>Wed 22 Oct&nbsp;&nbsp;11:30</span>
    </div>
    <div id="scenes"></div>
    <div class="hud" id="hud"></div>
    <div class="flash" id="flash"></div>
    <svg class="cursor" id="cursor" viewBox="0 0 26 26"></svg>
  </div>

  <!-- Outro -->
  <div class="layer" id="outro">
    <div class="center-col">
      <img class="big-icon" id="outroIcon" src="../../Cheese/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png" style="width:220px;height:220px">
      <div class="wordmark" style="font-size:110px">Cheese</div>
      <div class="pills">
        <div class="pill y">Free &amp; open source</div>
        <div class="pill">MIT licensed</div>
        <div class="pill">macOS 27</div>
      </div>
      <div class="term"><span class="p">$</span> curl -fsSL https://raw.githubusercontent.com/maanit-gupta/Cheese/main/install.sh | bash</div>
      <div class="url">github.com/maanit-gupta/Cheese</div>
    </div>
  </div>
</div>

<script>
// ---------- timing helpers (everything is a pure function of t, so frames render deterministically) ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const win = (t, a, b, f = .35) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
const $ = id => document.getElementById(id);
const keyHTML = keys => keys.map(k => `<div class="key">${k}</div>`).join('');

const CURSOR_ARROW = '<path d="M3 2 L3 21 L8 16.5 L11.5 24 L14.5 22.6 L11 15.4 L18 15.4 Z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>';
const CURSOR_CROSS = '<path d="M13 1 V25 M1 13 H25" stroke="#fff" stroke-width="3"/><path d="M13 1 V25 M1 13 H25" stroke="#000" stroke-width="1.2"/>';

const hud = $('hud'), cursor = $('cursor'), flash = $('flash');

// HUD showing keys pressed: list of [start, end, keys]
function setHud(lt, events) {
  let shown = null, op = 0, sc = 1;
  for (const [a, b, keys] of events) {
    const v = win(lt, a, b, .18);
    if (v > 0) { shown = keys; op = v; sc = lerp(.9, 1, eo(prog(lt, a, a + .2))); }
  }
  if (shown) {
    const html = keyHTML(shown);
    if (hud.dataset.k !== html) { hud.innerHTML = html; hud.dataset.k = html; }
  }
  hud.style.opacity = op;
  hud.style.transform = `translateX(-50%) scale(${sc})`;
}
function setCursor(x, y, op, kind = 'arrow') {
  if (cursor.dataset.kind !== kind) { cursor.innerHTML = kind === 'arrow' ? CURSOR_ARROW : CURSOR_CROSS; cursor.dataset.kind = kind; }
  const off = kind === 'arrow' ? [3, 2] : [13, 13];
  cursor.style.left = (x - off[0]) + 'px'; cursor.style.top = (y - off[1]) + 'px'; cursor.style.opacity = op;
}
function path(lt, pts) { // pts: [t, x, y]; eased between keyframes
  if (lt <= pts[0][0]) return [pts[0][1], pts[0][2]];
  for (let i = 1; i < pts.length; i++) {
    if (lt <= pts[i][0]) { const p = eio(prog(lt, pts[i - 1][0], pts[i][0])); return [lerp(pts[i - 1][1], pts[i][1], p), lerp(pts[i - 1][2], pts[i][2], p)]; }
  }
  const l = pts[pts.length - 1]; return [l[1], l[2]];
}
function toast(el, lt, a, b) {
  const v = win(lt, a, b, .25);
  el.style.opacity = v;
  el.style.transform = `translateX(-50%) translateY(${(1 - eo(prog(lt, a, a + .3))) * 30}px)`;
}

// ---------- scenes ----------
const scenes = [];
const scenesEl = $('scenes'), panelsEl = $('panels');
function scene(def) {
  const layer = document.createElement('div'); layer.className = 'layer'; layer.innerHTML = def.html; scenesEl.appendChild(layer);
  const panel = document.createElement('div'); panel.className = 'panel';
  panel.innerHTML = `<div class="num">${def.num}</div><h2>${def.title}</h2><p>${def.desc}</p><div class="keys">${def.keys.map(k => `<div class="key">${k}</div>`).join('')}</div>`;
  panelsEl.appendChild(panel);
  def.layer = layer; def.panel = panel; def.q = s => layer.querySelector(s);
  if (def.init) def.init(def);
  scenes.push(def);
}

// 1. Clipboard history -------------------------------------------------------
const CLIPS = [
  { i: '¶', t: 'Meeting notes — Q4 roadmap', full: 'Meeting notes — Q4 roadmap<br>• Ship Cheese v0.1 to GitHub<br>• Write the README and install guide<br>• Record a promo video', meta: 'Text · copied 2 min ago' },
  { i: '🔗', t: 'https://github.com/maanit-gupta/Cheese', full: 'https://github.com/maanit-gupta/Cheese', meta: 'Link · copied 6 min ago' },
  { i: '🖼', t: 'Screenshot 840 × 420', full: '<div style="height:150px;border-radius:10px;background:linear-gradient(135deg,#ffc83d,#f29e1f 60%,#8a3d6b)"></div>', meta: 'Image · text inside is searchable' },
  { i: '{}', t: 'let total = cart.reduce(0) { $0 + $1.price }', full: '<code style="font:15px SF Mono,Menlo,monospace">let total = cart.reduce(0) { $0 + $1.price }</code>', meta: 'Text · copied 18 min ago' },
  { i: '📄', t: 'Invoice-October.pdf', full: '📄 Invoice-October.pdf<br><span style="color:#9a9a9e">~/Documents/Invoices</span>', meta: 'File · copied 1 hr ago' },
  { i: '¶', t: 'Road trip packing list', full: 'Road trip packing list<br>• Chargers • Snacks • Playlist', meta: 'Text · copied yesterday' },
];
scene({
  id: 'clip', start: 4.0, end: 12.2, num: '01 — CLIPBOARD', title: 'Clipboard history', keys: ['⌃', '⌥', 'V'],
  desc: 'Everything you copy — text, rich text, images and files — searchable and one keystroke from pasting.',
  html: `
    <div class="win" style="left:60px;top:90px;width:560px;height:440px">
      <div class="tb"><div class="dots"><i></i><i></i><i></i></div>Notes</div>
      <div class="body" id="notesBody"><b style="font-size:22px">Monday</b><br>Call with the design team at 3.<br><span id="pasted" style="display:block;margin-top:10px;border-radius:6px;padding:2px 4px;margin-left:-4px"></span></div>
    </div>
    <div class="pop" id="pop">
      <div class="search"><span style="color:#888">⌕</span><span id="q"></span></div>
      <div class="cols"><div class="list" id="list"></div><div class="preview" id="prev"></div></div>
    </div>`,
  update(lt, s) {
    setHud(lt, [[.3, 1.3, ['⌃', '⌥', 'V']], [4.4, 5.2, ['↩']]]);
    const pop = s.q('#pop');
    const open = prog(lt, .7, 1.05), close = prog(lt, 4.7, 5.0);
    pop.style.opacity = open * (1 - close);
    pop.style.transform = `scale(${lerp(.92, 1, back(open)) - close * .04})`;
    $('mbCheese').classList.toggle('on', lt > .6 && lt < 4.9);

    const query = 'road'.slice(0, Math.floor(clamp((lt - 1.5) / .25, 0, 4)));
    s.q('#q').innerHTML = (query ? query : '<span class="ph">Search history</span>') + (lt % 1 < .55 ? '<span class="caret"></span>' : '');
    const visible = CLIPS.filter(c => c.t.toLowerCase().includes(query));
    const selIdx = 0;
    const listHTML = visible.map((c, i) => {
      const t = query ? c.t.replace(new RegExp(query, 'i'), m => `<span class="${i === selIdx ? '' : 'mark'}" style="${i === selIdx ? 'text-decoration:underline' : ''}">${m}</span>`) : c.t;
      return `<div class="row ${i === selIdx ? 'on' : ''}"><div class="ri">${c.i}</div><div class="t">${t}</div><div class="n">⌘${i + 1}</div></div>`;
    }).join('');
    const list = s.q('#list'); if (list.dataset.h !== listHTML) { list.innerHTML = listHTML; list.dataset.h = listHTML; }
    const sel = visible[selIdx];
    const prevHTML = sel ? `${sel.full}<div class="meta">${sel.meta}</div>` : '';
    const prev = s.q('#prev'); if (prev.dataset.h !== prevHTML) { prev.innerHTML = prevHTML; prev.dataset.h = prevHTML; }

    const pasted = s.q('#pasted');
    const pv = prog(lt, 5.15, 5.4);
    pasted.innerHTML = pv > 0 ? CLIPS[0].full : '';

// 3. OCR --------------------------------------------------------------------
const OCR_TEXT = 'The best tools disappear into your day. Press a shortcut, drag over anything on screen — a video frame, a locked PDF, a slide in a meeting — and the words land on your clipboard, ready to paste.';
const ocrWords = OCR_TEXT.split(' ');
const qrCells = (() => { let s = 7, out = []; for (let i = 0; i < 21 * 21; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; out.push((s >> 16) & 1); } return out; })();
function qrHTML() {
  let h = ''; const finder = (r, c) => { for (const [fr, fc] of [[0, 0], [0, 14], [14, 0]]) { const y = r - fr, x = c - fc; if (y >= 0 && y < 7 && x >= 0 && x < 7) return (y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4)) ? 1 : 0; } return -1; };
  for (let r = 0; r < 21; r++) for (let c = 0; c < 21; c++) { const f = finder(r, c); const on = f === -1 ? qrCells[r * 21 + c] : f; if (on) h += `<div style="position:absolute;left:${c * 8}px;top:${r * 8}px;width:8px;height:8px;background:#111"></div>`; }
  return `<div style="position:relative;width:168px;height:168px">${h}</div>`;
}

    sel.style.opacity = r ? 1 : 0;
    if (r) Object.assign(sel.style, { left: r[0] + 'px', top: r[1] + 'px', width: (r[2] - r[0]) + 'px', height: (r[3] - r[1]) + 'px' });

    else if (lt > 3.9 && lt < 4.7) { const [cx, cy] = path(lt, [[3.9, 600, 500], [4.1, r2[0], r2[1]], [4.7, r2[2], r2[3]]]); setCursor(cx, cy, 1, 'cross'); }

// ---------- master timeline ----------
const DURATION = 50;
const screen = $('screen');
window.DURATION = DURATION;
window.seek = function (t) {
  // intro
  const iv = 1 - prog(t, 3.6, 4.2);
  $('intro').style.opacity = iv;
  const ip = prog(t, .2, 1.1);
  $('introIcon').style.transform = `scale(${lerp(.6, 1, back(ip))}) rotate(${lerp(-12, 0, eo(ip))}deg)`;
  $('introIcon').style.opacity = ip;
  $('introWord').style.opacity = prog(t, .8, 1.4); $('introWord').style.transform = `translateY(${(1 - eo(prog(t, .8, 1.4))) * 30}px)`;
  $('introTag').style.opacity = prog(t, 1.4, 2.0); $('introTag').style.transform = `translateY(${(1 - eo(prog(t, 1.4, 2.0))) * 20}px)`;

  // screen
  const sv = win(t, 3.9, 45.8, .5);
  screen.style.opacity = sv;
  screen.style.transform = `translateY(${(1 - eo(prog(t, 3.9, 4.6))) * 60}px) scale(${lerp(.97, 1, eo(prog(t, 3.9, 4.6)))})`;

  let anyHud = false;
  for (const s of scenes) {
    const v = win(t, s.start, s.end, .4);
    s.layer.style.opacity = v;
    s.panel.style.opacity = v;
    s.panel.style.transform = `translateX(${(1 - eo(prog(t, s.start, s.start + .6))) * -40}px)`;
    s.layer.style.visibility = v > 0 ? 'visible' : 'hidden';
  }
  // only the scene that owns time t drives shared elements (HUD, cursor, flash, menubar icon)
  const owner = [...scenes].reverse().find(s => t >= s.start) || null;
  if (owner && t < owner.end) owner.update(t - owner.start, owner);
  else { hud.style.opacity = 0; setCursor(0, 0, 0); }
  if (!owner || owner.id !== 'shot') flash.style.opacity = 0;

  // outro
  const ov = prog(t, 45.4, 46.2);
  $('outro').style.opacity = ov;
  $('outroIcon').style.transform = `scale(${lerp(.7, 1, back(prog(t, 45.5, 46.4)))})`;
};
window.seek(0);
