<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cheese</title>
<style>
:root { --paper:#FBF6EA; --ink:#1d1d1f; --cheese:#FFC83D; --deep:#F29E1F; --muted:#77726a; --mono:"SF Mono", ui-monospace, Menlo, monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--paper); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; }
.mono { font-family:var(--mono); }
#bg { position:absolute; inset:0; background:radial-gradient(1500px 950px at 50% 38%, #FFFCF3 0%, #F9F0DA 62%, #F2E3C0 100%); overflow:hidden; }
#bg .bh { position:absolute; border-radius:50%; background:#F1E1B9; box-shadow:inset 10px 16px 30px rgba(170,120,30,.18); }
#stage { position:absolute; inset:0; overflow:hidden; z-index:1; isolation:isolate; }
.scene { position:absolute; inset:0; display:none; }

/* nav */
#nav { position:absolute; left:0; right:0; top:0; height:110px; z-index:50; opacity:0; }
.brand { position:absolute; left:64px; top:30px; display:flex; align-items:center; gap:14px; font-size:30px; font-weight:800; letter-spacing:-.5px; }
.brand img { width:52px; height:52px; }
#pills { position:absolute; right:64px; top:36px; display:flex; gap:2px; padding:5px; border-radius:999px; background:rgba(29,29,31,.06); }
.np { position:relative; z-index:1; padding:9px 18px; font-size:19px; font-weight:600; color:rgba(29,29,31,.6); border-radius:999px; white-space:nowrap; }
.np.mono { font-size:17px; }
.np.on { color:var(--cheese); }
#puck { position:absolute; top:5px; bottom:5px; border-radius:999px; background:var(--ink); z-index:0; }

/* chapter iris */
#iris { position:absolute; inset:0; z-index:40; display:none; overflow:hidden; background:radial-gradient(circle at 50% 42%, #FFDA6A 0%, #FFC83D 46%, #F4A92A 100%); }
#iris .h { position:absolute; border-radius:50%; background:#F0A225; box-shadow:inset 8px 14px 24px rgba(150,80,0,.38); }
#iris-eb { position:absolute; top:292px; left:0; right:0; text-align:center; font-size:30px; font-weight:600; color:rgba(29,29,31,.62); letter-spacing:3px; }
#iris-word { position:absolute; top:350px; left:0; right:0; text-align:center; font-size:280px; font-weight:900; letter-spacing:-10px; line-height:1; color:var(--ink); white-space:nowrap; }
#iris-word.tt { font-family:var(--mono); font-size:180px; font-weight:800; letter-spacing:-8px; top:395px; }
#iris-word i { display:inline-block; width:.2em; height:.2em; border-radius:50%; background:#E8921A; box-shadow:inset .03em .05em .06em rgba(120,60,0,.6); margin-left:.07em; }
#iris-sub { position:absolute; top:690px; left:0; right:0; text-align:center; font-size:36px; font-weight:600; color:rgba(29,29,31,.72); }
#wipe { position:absolute; top:0; bottom:0; width:18px; z-index:45; display:none; background:linear-gradient(90deg, #F29E1F, #FFC83D); box-shadow:0 0 50px 8px rgba(242,158,31,.55); }

/* captions + chords */
.cap { position:absolute; left:0; right:0; top:878px; text-align:center; z-index:30; }
.ct { font-size:54px; font-weight:800; letter-spacing:-1.6px; }
.cs { margin-top:10px; font-size:26px; color:var(--muted); font-weight:500; }
.kc { display:inline-block; padding:0 10px; margin:0 3px; border-radius:8px; background:#fff; box-shadow:0 2px 0 #ddd2bd; font-size:.92em; line-height:1.35; color:var(--ink); font-weight:600; }
#chord { position:absolute; left:44px; bottom:40px; display:flex; gap:10px; z-index:48; opacity:0; }
.ck { min-width:66px; height:66px; padding:0 16px; border-radius:15px; background:#fff; box-shadow:0 5px 0 #d9cfba, 0 14px 26px -10px rgba(80,50,0,.4); font-size:30px; font-weight:600; display:flex; align-items:center; justify-content:center; }
.ck.down { background:var(--cheese); box-shadow:0 1px 0 #cf961d, 0 6px 14px -6px rgba(80,50,0,.4); translate:0 4px; }

/* the Mac */
.screen { position:absolute; left:310px; top:118px; width:1300px; height:740px; padding:10px; border-radius:28px; background:#1d1d1f; box-shadow:0 50px 90px -40px rgba(90,55,0,.55), 0 0 0 1px rgba(0,0,0,.5); }
.scr { position:relative; width:1280px; height:720px; border-radius:18px; overflow:hidden;
  background:radial-gradient(900px 600px at 12% 0%, #FFEDB8 0%, transparent 60%), radial-gradient(900px 700px at 100% 100%, #D9823A 0%, transparent 62%), linear-gradient(135deg, #F8D88E 0%, #EFB35A 52%, #DA8A40 100%); }
.mbar { position:absolute; left:0; top:0; right:0; height:30px; display:flex; align-items:center; gap:20px; padding:0 18px; font-size:13.5px; background:rgba(255,250,240,.66); z-index:20; }
.mbar b { font-weight:700; }
.mr { position:absolute; right:14px; top:0; height:30px; display:flex; align-items:center; gap:16px; }
.wi { width:96px; height:24px; display:flex; align-items:center; gap:6px; padding:0 6px; border-radius:6px; font-weight:600; font-size:13px; }
.wi svg { width:18px; height:18px; flex:none; }
.wi.hot { background:rgba(255,200,61,.9); }
.mi { width:22px; display:flex; justify-content:center; }
.clk { width:150px; text-align:right; }
.win { position:absolute; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 26px 50px -20px rgba(60,30,0,.5), 0 0 0 1px rgba(0,0,0,.12); }
.wt { height:34px; display:flex; align-items:center; justify-content:center; position:relative; background:#f6f3ee; border-bottom:1px solid #e7e2d9; font-size:13px; font-weight:600; color:#55524c; }
.wt i { position:absolute; top:11px; width:12px; height:12px; border-radius:50%; }
.wt i:nth-child(1) { left:14px; background:#FF5F57; } .wt i:nth-child(2) { left:34px; background:#FEBC2E; } .wt i:nth-child(3) { left:54px; background:#28C840; }
.wt .url { background:#fff; border:1px solid #e2ddd3; border-radius:8px; padding:3px 46px; font-weight:500; color:#5b5852; }
.wb { position:absolute; left:0; right:0; top:34px; bottom:0; overflow:hidden; }
.win.dark { background:#141417; } .win.dark .wt { background:#26262b; border-color:#09090b; color:#a9a9ae; }
.panel { position:absolute; background:#FCFAF6; border-radius:14px; box-shadow:0 30px 60px -22px rgba(40,20,0,.45), 0 0 0 1px rgba(29,29,31,.1); }
.toast { position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:11px 20px 11px 12px; border-radius:999px; background:rgba(29,29,31,.93); color:#fff; font-size:17px; font-weight:600; white-space:nowrap; box-shadow:0 20px 40px -12px rgba(0,0,0,.5); z-index:70; }
.tchk { width:28px; height:28px; border-radius:50%; background:var(--cheese); display:flex; align-items:center; justify-content:center; flex:none; }
.tact { margin-left:4px; padding:5px 14px; border-radius:999px; background:rgba(255,255,255,.17); font-size:15px; }
.cur { position:absolute; z-index:90; width:0; height:0; }
.cur svg { position:absolute; left:-6px; top:-4px; transform-origin:6px 4px; }
.rip { position:absolute; left:-22px; top:-22px; width:44px; height:44px; border-radius:50%; border:3px solid var(--deep); background:rgba(255,200,61,.25); opacity:0; }
.btn { display:inline-flex; align-items:center; justify-content:center; height:30px; padding:0 14px; border-radius:8px; background:#fff; border:1px solid #ddd7cc; font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; }
.btn.pri { background:var(--cheese); border-color:#e7ab2a; }
.caps { font-size:11px; font-weight:700; letter-spacing:.8px; color:#8d877c; }
.menu { position:absolute; padding:5px; border-radius:10px; background:rgba(251,249,245,.98); box-shadow:0 18px 40px -10px rgba(0,0,0,.38), 0 0 0 1px rgba(0,0,0,.1); font-size:14px; z-index:40; }
.mit { height:26px; display:flex; align-items:center; padding:0 10px 0 2px; border-radius:5px; white-space:nowrap; }
.mit.hov { background:var(--cheese); }
.mchk { width:22px; text-align:center; font-size:12px; font-weight:700; }
.mtt { flex:1; display:flex; align-items:center; gap:7px; }
.mk { color:#8a857c; font-size:13px; margin-left:18px; }
.msub { color:#8a857c; margin-left:12px; }
.msep { height:1px; background:rgba(0,0,0,.1); margin:5px 8px; }
.mhdr { height:22px; padding-left:24px; font-size:11px; font-weight:700; color:#8d877c; letter-spacing:.6px; display:flex; align-items:center; }

/* intro */
.i-ring { position:absolute; left:780px; top:100px; width:360px; height:360px; border-radius:50%; border:4px solid var(--cheese); }
.i-icon { position:absolute; left:800px; top:120px; width:320px; height:320px; }
.i-word { position:absolute; left:0; right:0; top:450px; text-align:center; font-size:150px; font-weight:900; letter-spacing:-6px; line-height:1.1; }
.i-word span { display:inline-block; }
.i-tag { position:absolute; left:0; right:0; top:640px; text-align:center; font-size:46px; font-weight:700; letter-spacing:-1px; }
.i-sub { position:absolute; left:0; right:0; top:710px; text-align:center; font-size:30px; color:var(--muted); font-weight:500; }
.i-pills { position:absolute; left:0; right:0; top:800px; display:flex; justify-content:center; gap:12px; }
.ip { padding:12px 26px; border-radius:999px; background:#fff; box-shadow:0 2px 0 #e6dcc6, 0 10px 24px -14px rgba(80,50,0,.4); font-size:25px; font-weight:650; }
.ip.tt { background:var(--cheese); font-family:var(--mono); font-size:22px; font-weight:700; display:flex; align-items:center; }

/* clipboard popover */
.pop { position:absolute; left:596px; top:40px; width:680px; height:460px; border-radius:14px; background:#FCFAF6; box-shadow:0 30px 60px -18px rgba(40,20,0,.5), 0 0 0 1px rgba(0,0,0,.1); display:flex; transform-origin:347px 0; z-index:30; }
.pop::before { content:''; position:absolute; left:340px; top:-7px; width:14px; height:14px; background:#FCFAF6; transform:rotate(45deg); box-shadow:-1px -1px 0 rgba(0,0,0,.08); }
.pl { position:relative; width:280px; padding:10px; }
.ps { height:34px; border-radius:9px; background:rgba(29,29,31,.06); display:flex; align-items:center; gap:7px; padding:0 10px; font-size:15px; }
.ps .ph { margin-left:auto; font-size:11.5px; color:#9a948a; }
.caret { display:inline-block; width:2px; height:18px; background:var(--deep); vertical-align:-3px; }
.plist { position:absolute; left:10px; right:10px; top:54px; display:flex; flex-direction:column; gap:4px; }
.hr { height:44px; display:flex; align-items:center; gap:10px; padding:0 8px; border-radius:7px; position:relative; font-size:13.5px; }
.hr.sel { background:rgba(242,160,31,.2); }
.hr.sel::before { content:''; position:absolute; left:0; top:9px; bottom:9px; width:2px; border-radius:2px; background:var(--deep); }
.hi { width:28px; height:28px; border-radius:6px; flex:none; display:flex; align-items:center; justify-content:center; background:rgba(29,29,31,.05); overflow:hidden; }
.ht { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hb { font-size:11.5px; color:#a29b90; }
.hn { width:22px; height:22px; border-radius:50%; background:var(--deep); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.pdv { width:1px; background:rgba(29,29,31,.09); }
.pr { position:relative; flex:1; }
.pv { position:absolute; left:0; right:0; top:0; bottom:32px; padding:14px 16px; }
.pvh { display:flex; align-items:center; gap:8px; font-size:12px; color:#8d877c; margin-bottom:12px; }
.pvh b { color:var(--ink); font-weight:700; font-size:12.5px; }
.pvt { font-size:16px; line-height:1.5; }
.pf { position:absolute; left:0; right:0; bottom:0; height:32px; border-top:1px solid rgba(29,29,31,.08); display:flex; align-items:center; padding:0 14px; font-size:12px; color:#8d877c; white-space:nowrap; }
.pf b { color:var(--ink); margin-right:6px; }
.chk { background-image:linear-gradient(45deg,#eee9df 25%,transparent 25%,transparent 75%,#eee9df 75%), linear-gradient(45deg,#eee9df 25%,transparent 25%,transparent 75%,#eee9df 75%); background-size:16px 16px; background-position:0 0, 8px 8px; background-color:#f8f5ef; border-radius:10px; }
.lt { border-radius:4px; padding:0 3px; margin:0 -3px; }
.mk-img { position:relative; border-radius:8px; overflow:hidden; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.08); }
.mk-img i { position:absolute; left:0; right:0; top:0; height:22%; background:var(--c); }
.mk-img b { position:absolute; left:10%; height:7%; border-radius:99px; background:#e8e3da; }
.mk-img s { position:absolute; left:10%; bottom:12%; width:30%; height:12%; border-radius:6px; background:var(--c); opacity:.75; }

/* terminal */
.term { font-family:var(--mono); font-size:15px; line-height:22px; color:#e7e5df; padding:16px 18px; white-space:pre; }
.term .p { color:#7FD1FF; } .term .y { color:var(--cheese); } .term .g { color:#5AD27A; } .term .r { color:#FF7468; } .term .d { color:#8b8a92; }
.md { font-family:var(--mono); font-size:12.5px; line-height:18.5px; white-space:pre; color:#2b2924; }
.md .h { color:#B86A00; font-weight:700; } .md .f { color:#a39b8d; }

/* slide + ink */
.slide { position:absolute; inset:0; background:#FFFDF8; }
.card3 { position:absolute; top:290px; width:300px; height:230px; border-radius:18px; background:#fff; box-shadow:0 0 0 1px #ece6da, 0 18px 30px -22px rgba(60,40,0,.4); padding:26px 28px; }
.card3 .k { font-size:13px; font-weight:800; letter-spacing:1.5px; color:#b2aa9b; }
.card3 .n { font-size:42px; font-weight:800; margin-top:10px; letter-spacing:-1px; }
.card3 .d { font-size:26px; color:#77726a; margin-top:6px; font-weight:600; }
.card3 .bar { position:absolute; left:28px; right:28px; bottom:28px; height:8px; border-radius:4px; background:#f0ebe1; overflow:hidden; }
.card3 .bar i { display:block; height:100%; background:var(--deep); }
.rail { position:absolute; left:18px; top:60px; width:50px; padding:6px 5px; border-radius:14px; background:#FCFAF6; box-shadow:0 18px 36px -16px rgba(0,0,0,.4), 0 0 0 1px rgba(0,0,0,.1); display:flex; flex-direction:column; align-items:center; gap:2px; z-index:25; }
.rb { width:40px; height:29px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#3a3833; position:relative; }
.rb.on { background:rgba(255,200,61,.35); box-shadow:inset 0 0 0 1.5px var(--deep); }
.rsep { width:28px; height:1px; background:rgba(0,0,0,.1); margin:3px 0; }
.brush { position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; border:2px solid #E5483B; background:rgba(229,72,59,.14); z-index:26; }

/* finder */
.side { position:absolute; left:0; top:0; bottom:0; width:150px; background:#f4f1eb; border-right:1px solid #e7e2d9; padding:14px 12px; font-size:13px; color:#55524c; }
.side div { padding:5px 8px; border-radius:6px; } .side .on { background:rgba(29,29,31,.07); font-weight:600; color:var(--ink); }
.cell { position:absolute; width:112px; height:120px; display:flex; flex-direction:column; align-items:center; }
.cell .ico { width:72px; height:76px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-top:2px; }
.cell .nm { margin-top:4px; font-size:12.5px; padding:1px 7px; border-radius:5px; white-space:nowrap; max-width:110px; overflow:hidden; text-overflow:ellipsis; }
.cell.sel .ico { background:rgba(29,29,31,.08); } .cell.sel .nm { background:var(--deep); color:#fff; }
.hub-card { flex:1; height:92px; border-radius:10px; background:#fff; box-shadow:0 0 0 1px #ebe5da; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-size:13.5px; font-weight:600; }
.hub-row { height:40px; display:flex; align-items:center; gap:10px; padding:0 10px; border-radius:7px; font-size:14px; }
.hub-row.hov { background:rgba(255,200,61,.35); }
.note { position:absolute; width:360px; border-radius:16px; background:rgba(252,250,246,.98); box-shadow:0 20px 40px -14px rgba(0,0,0,.4), 0 0 0 1px rgba(0,0,0,.08); padding:14px 16px; display:flex; gap:12px; z-index:45; }

/* share */
.sh-strip { margin:0 14px 10px; border-radius:10px; display:flex; align-items:center; gap:10px; padding:0 12px; font-size:13px; }
.dev { width:104px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:600; }
.dev .di { width:44px; height:44px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px #e6dfd2; display:flex; align-items:center; justify-content:center; position:relative; }
.phone { position:absolute; width:330px; height:690px; border-radius:54px; background:#111; padding:11px; box-shadow:0 40px 80px -30px rgba(60,30,0,.6), 0 0 0 2px #2a2a2e; }
.pscr { position:relative; width:100%; height:100%; border-radius:44px; overflow:hidden; background:#F5F5F7; }
.pcard { margin:0 14px 12px; border-radius:16px; background:#fff; border:1px solid rgba(128,128,128,.16); padding:12px 14px; }
.prow { display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13px; }
.pbtn { height:38px; border-radius:12px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; margin-top:8px; }

/* laptop */
.mac3d { position:relative; width:640px; height:470px; perspective:1700px; perspective-origin:50% -30%; }
.rig { position:absolute; inset:0; transform-style:preserve-3d; }
.lid3d { position:absolute; left:80px; top:0; width:480px; height:300px; transform-origin:50% 100%; transform-style:preserve-3d; }
.lid3d .face { position:absolute; inset:0; border-radius:18px 18px 4px 4px; backface-visibility:hidden; }
.lid3d .front { background:#0d0c10; box-shadow:0 0 0 3px #c9c3b8; padding:14px 14px 20px; }
.lid3d .scr3d { position:relative; width:100%; height:100%; border-radius:6px; overflow:hidden; background:linear-gradient(135deg, #F8D88E 0%, #EFB35A 52%, #DA8A40 100%); display:flex; align-items:center; justify-content:center; }
.lid3d .back { background:linear-gradient(160deg, #ebe6dc, #b3ab9d); transform:rotateX(180deg); display:flex; align-items:center; justify-content:center; }
.lid3d .back img { width:84px; height:84px; opacity:.55; filter:grayscale(1) brightness(1.2); }
.deck { position:absolute; left:70px; top:300px; width:500px; height:310px; transform-origin:50% 0; transform:rotateX(90deg); transform-style:preserve-3d; border-radius:4px 4px 18px 18px; background:linear-gradient(#e2ddd3, #c4bdb0); }
.deck .kb { position:absolute; left:40px; right:40px; top:26px; height:140px; border-radius:6px; background:#2a282f; background-image:repeating-linear-gradient(90deg, transparent 0 30px, #45424c 30px 32px), repeating-linear-gradient(0deg, transparent 0 26px, #45424c 26px 28px); }
.deck .tp { position:absolute; left:150px; right:150px; top:184px; height:100px; border-radius:10px; background:#d3ccc0; box-shadow:inset 0 0 0 1px #b2aa9d; }
.deck .lip { position:absolute; left:0; right:0; top:100%; height:14px; transform-origin:50% 0; transform:rotateX(-90deg); border-radius:0 0 10px 10px; background:linear-gradient(#c4bdb0, #958d80); }

/* misc */
.sel-box { position:absolute; border:1.5px solid #fff; box-shadow:0 0 0 4000px rgba(20,14,4,.42); z-index:50; }
.dimbadge { position:absolute; padding:4px 10px; border-radius:7px; background:rgba(20,18,14,.85); color:#fff; font:600 13px var(--mono); z-index:51; white-space:nowrap; }
.ap i { display:block; height:11px; border-radius:6px; background:#e0d9cc; margin:11px 0; }
.ap { margin:18px 0; }
.dock { position:absolute; left:50%; transform:translateX(-50%); bottom:8px; height:56px; padding:6px 8px; border-radius:18px; background:rgba(255,250,240,.55); box-shadow:0 0 0 1px rgba(255,255,255,.4); display:flex; gap:8px; z-index:15; }
.pal-row { height:54px; display:flex; align-items:center; gap:14px; padding:0 16px; border-radius:10px; font-size:19px; }
.pal-row.sel { background:var(--cheese); }
.pal-row .mod { color:#8d877c; font-size:15px; }
.pal-row.sel .mod { color:rgba(29,29,31,.6); }
.pal-row .hk { margin-left:auto; display:flex; gap:4px; }
.pal-row .hk span { min-width:26px; height:26px; padding:0 6px; border-radius:6px; background:rgba(29,29,31,.07); font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; }
.ak-row { height:40px; display:flex; align-items:center; gap:10px; padding:0 10px; border-radius:7px; font-size:14px; }
.lockb { width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; }
.lockb.on { background:rgba(255,200,61,.45); }
.stp { display:flex; align-items:center; gap:14px; height:44px; font-size:18px; font-weight:600; }
.stp .sc { width:28px; height:28px; border-radius:50%; border:2px solid #d8d0c0; display:flex; align-items:center; justify-content:center; flex:none; }
.stp.done .sc { background:var(--cheese); border-color:var(--deep); }
</style>
</head>

<div id="bg"></div>

<script>
'use strict';
// ---------------------------------------------------------------- maths
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const out = p => 1 - Math.pow(1 - p, 3);
const back = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
function kf(t, pts, e = ease) {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) {
      const [t0, v0] = pts[i - 1], [t1, v1] = pts[i];
      const p = e((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], p)) : lerp(v0, v1, p);
    }
  }
  return pts[pts.length - 1][1];
}
const type = (s, lt, a, cps = 12) => s.slice(0, clamp(Math.floor((lt - a) * cps), 0, s.length));

// ---------------------------------------------------------------- DOM helpers
const $ = id => { const e = document.getElementById(id); if (!e) throw new Error('missing #' + id); return e; };
function S(id, st) { const e = typeof id === 'string' ? $(id) : id; for (const k in st) e.style[k] = st[k]; return e; }
function txt(id, s) { const e = $(id); if (e.textContent !== s) e.textContent = s; }
function htm(id, s) { const e = $(id); if (e._h !== s) { e.innerHTML = s; e._h = s; } }
function cls(id, c, on) { $(id).classList.toggle(c, !!on); }
function op(id, v) { const e = $(id); e.style.opacity = v.toFixed(3); e.style.visibility = v <= .001 ? 'hidden' : 'visible'; return e; }
// Fade in at a (and out at b), with an optional rise, slide, scale or pop.
function show(id, lt, a, b = null, o = {}) {
  const d = o.d ?? .3, e = $(id);
  const p = seg(lt, a, a + d), q = b == null ? 0 : ease(seg(lt, b, b + (o.dOut ?? d)));
  const v = out(p) * (1 - q);
  e.style.opacity = v.toFixed(3); e.style.visibility = v <= .001 ? 'hidden' : 'visible';
  const dx = (o.dx ?? 0) * (1 - out(p)), dy = (o.dy ?? 0) * (1 - out(p)) + (o.dyOut ?? 0) * q;
  e.style.translate = `${dx.toFixed(2)}px ${dy.toFixed(2)}px`;
  let sc = 1;
  if (o.sc != null) sc = lerp(o.sc, 1, o.pop ? back(p) : out(p));
  if (o.scOut != null) sc *= lerp(1, o.scOut, q);
  e.style.scale = sc.toFixed(4);
  return v;
}

// ---------------------------------------------------------------- art
const ICON = '../../Cheese/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png';
const WEDGE = `<svg viewBox="0 0 18 18"><path fill-rule="evenodd" fill="currentColor" d="M1.4 7.5 L10.1 2.6 Q11.3 1.9 12.5 2.4 Q16.6 4.3 16.6 7.5 Z M11.7 4.1 A.85 .85 0 1 0 11.7 5.8 A.85 .85 0 1 0 11.7 4.1 Z"/><path fill-rule="evenodd" fill="currentColor" d="M3 8.9 H15 A1.6 1.6 0 0 1 16.6 10.5 V14.4 A1.6 1.6 0 0 1 15 16 H13.9 A1.35 1.35 0 0 0 11.2 16 H3 A1.6 1.6 0 0 1 1.4 14.4 V10.5 A1.6 1.6 0 0 1 3 8.9 Z M5.3 10.9 A1.75 1.75 0 1 0 5.3 14.4 A1.75 1.75 0 1 0 5.3 10.9 Z M10.4 10.4 A1 1 0 1 0 10.4 12.4 A1 1 0 1 0 10.4 10.4 Z"/></svg>`;
const WIFI = `<svg width="18" height="14" viewBox="0 0 18 14"><path d="M1 5 Q9 -2 17 5 M3.6 7.8 Q9 3 14.4 7.8 M6.2 10.4 Q9 8 11.8 10.4" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="12.6" r="1.3" fill="#1d1d1f"/></svg>`;
const BATT = `<svg width="26" height="13" viewBox="0 0 26 13"><rect x=".7" y=".7" width="21.6" height="11.6" rx="3.2" fill="none" stroke="#1d1d1f" stroke-opacity=".55" stroke-width="1.3"/><rect x="2.6" y="2.6" width="15" height="7.8" rx="1.8" fill="#1d1d1f"/><rect x="23.4" y="4.3" width="1.8" height="4.4" rx=".9" fill="#1d1d1f" fill-opacity=".55"/></svg>`;
const CUR = `<svg width="30" height="34" viewBox="0 0 28 32"><path d="M6 4 L6 25 L11.2 20.2 L14.8 28.4 L18.4 26.8 L14.9 18.8 L22 18.8 Z" fill="#1d1d1f" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg>`;
const CHECK = `<svg width="15" height="15" viewBox="0 0 16 16"><path d="M3.2 8.4 L6.5 11.5 L12.8 4.6" fill="none" stroke="#1d1d1f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const I_TXT = `<svg width="16" height="16" viewBox="0 0 20 20"><path d="M4 5h12M4 9.5h12M4 14h8" stroke="#77726a" stroke-width="1.9" stroke-linecap="round"/></svg>`;
const I_LINK = `<svg width="17" height="17" viewBox="0 0 20 20"><path d="M8.5 11.5l3-3M7 9.5l-1.6 1.6a2.6 2.6 0 0 0 3.7 3.7L10.7 13M13 10.5l1.6-1.6a2.6 2.6 0 0 0-3.7-3.7L9.3 7" stroke="#77726a" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
const I_LOCK = (on) => on
  ? `<svg width="15" height="16" viewBox="0 0 16 18"><rect x="2" y="8" width="12" height="9" rx="2.5" fill="#B86A00"/><path d="M4.6 8 V5.6 a3.4 3.4 0 0 1 6.8 0 V8" fill="none" stroke="#B86A00" stroke-width="2"/></svg>`
  : `<svg width="15" height="16" viewBox="0 0 16 18"><rect x="2" y="8" width="12" height="9" rx="2.5" fill="none" stroke="#a39b8d" stroke-width="1.6"/><path d="M4.6 8 V5.6 a3.4 3.4 0 0 1 6.6 -1" fill="none" stroke="#a39b8d" stroke-width="1.6"/></svg>`;

function fileIcon(ext, color, w = 56) {
  return `<svg width="${w}" height="${w * 1.25}" viewBox="0 0 64 80"><path d="M7 2h35l18 18v53a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5z" fill="#fff" stroke="#d6d0c4" stroke-width="2"/><path d="M42 2v13a5 5 0 0 0 5 5h13" fill="#efeae0" stroke="#d6d0c4" stroke-width="2"/><rect x="2" y="44" width="58" height="21" rx="3" fill="${color}"/><text x="31" y="59.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" font-family="-apple-system, sans-serif">${ext}</text><g fill="#ddd7cb"><rect x="11" y="22" width="26" height="3.4" rx="1.7"/><rect x="11" y="30" width="38" height="3.4" rx="1.7"/></g></svg>`;

const FT = { DOCX:'#2B6CD9', XLSX:'#1F8F4E', PPTX:'#D9572B', PDF:'#E5483B', JPG:'#8A5BD6' };
function appIcon(bg, glyph, size = 44, fg = '#fff') {

}
const APPS = {

  Mail:     ['linear-gradient(#6FB8FF,#1F6FE6)', '✉'],
  Music:    ['linear-gradient(#FF6B81,#FA2D48)', '♪'],
  Notes:    ['linear-gradient(#FFF3B0,#FFD54A)', '≡', '#8a6d00'],
  Preview:  ['linear-gradient(#9AD3FF,#4A9BE8)', '▣'],
  Calendar: ['#fff', '2', '#E5483B'],
  Photos:   ['conic-gradient(#FF5E5E,#FFC83D,#5AD27A,#46A8F5,#B06BFF,#FF5E5E)', '✿'],
  Terminal: ['linear-gradient(#3a3a40,#16161a)', '›_', '#cfcfd4'],
  Finder:   ['linear-gradient(90deg,#7FC4FF 50%,#4A9BE8 50%)', '☺'],
  Code:     ['linear-gradient(#3EA6F2,#1468B8)', '⟨⟩'],
};
const app = (n, size) => { const a = APPS[n]; return appIcon(a[0], a[1], size, a[2]); };
function qrSVG(seed, n = 25, size = 160, dark = '#1d1d1f') {
  let s = seed * 9301 + 49297;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  const finder = (x, y) => (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!finder(x, y) && rnd() < .5) d += `M${x} ${y}h1v1h-1z`;
  const f = (x, y) => `M${x} ${y}h7v7h-7z M${x + 1} ${y + 1}v5h5v-5z M${x + 2} ${y + 2}h3v3h-3z`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path fill="${dark}" fill-rule="evenodd" d="${d} ${f(0, 0)} ${f(n - 7, 0)} ${f(0, n - 7)}"/></svg>`;
}
const mock = (c, w, h) => `<div class="mk-img" style="--c:${c};width:${w}px;height:${h}px"><i></i><b style="top:34%;width:62%"></b><b style="top:48%;width:44%"></b><b style="top:62%;width:54%"></b><s></s></div>`;

// ---------------------------------------------------------------- building blocks
const WX = 943;   // wedge centre in screen coordinates (menu bar layout below is fixed width)
function mbar(app, id, menus = ['File', 'Edit', 'View', 'Window', 'Help']) {
  return `<div class="mbar"><svg width="14" height="17" viewBox="0 0 14 17"><path fill="#1d1d1f" d="M11.6 9c0-2 1.6-2.9 1.7-3a3.7 3.7 0 0 0-2.9-1.6c-1.2-.1-2.4.7-3 .7s-1.6-.7-2.6-.7A3.9 3.9 0 0 0 1.5 6.4c-1.4 2.4-.4 6 1 8 .7 1 1.5 2 2.5 2s1.4-.6 2.6-.6 1.5.6 2.6.6 1.7-1 2.4-2a8 8 0 0 0 1.1-2.2A3.4 3.4 0 0 1 11.6 9zM9.6 3a3.4 3.4 0 0 0 .8-2.5 3.5 3.5 0 0 0-2.3 1.2 3.3 3.3 0 0 0-.8 2.4A2.9 2.9 0 0 0 9.6 3z"/></svg><b>${app}</b>${menus.map(m => `<span>${m}</span>`).join('')}
  <div class="mr"><span class="wi" id="${id}-wedge">${WEDGE}<span id="${id}-ind"></span></span><span class="mi">${WIFI}</span><span class="mi">${BATT}</span><span class="clk">Mon Nov 2&nbsp;&nbsp;10:41</span></div></div>`;
}
function screen(id, app, inner, o = {}) {
  return `<div class="screen" id="${id}-screen"><div class="scr" id="${id}-scr">${o.nobar ? '' : mbar(app, id, o.menus)}${inner}</div></div>`;
}
function win(id, title, x, y, w, h, body, cls = '') {
  return `<div class="win ${cls}" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="wt"><i></i><i></i><i></i><span>${title}</span></div><div class="wb">${body}</div></div>`;
}
function setFrame(id, f) { S(id, { left: f[0].toFixed(1) + 'px', top: f[1].toFixed(1) + 'px', width: f[2].toFixed(1) + 'px', height: f[3].toFixed(1) + 'px' }); }
const cursorHTML = id => `<div class="cur" id="${id}">${CUR}<div class="rip" id="${id}-r"></div></div>`;
function cursor(id, lt, pts, clicks = [], vis = [-9, 99]) {
  const e = $(id);
  const v = seg(lt, vis[0], vis[0] + .2) * (1 - seg(lt, vis[1] - .2, vis[1]));
  e.style.opacity = v.toFixed(3); e.style.visibility = v <= 0 ? 'hidden' : 'visible';
  if (v <= 0) return;
  const [x, y] = kf(lt, pts);
  e.style.left = x.toFixed(1) + 'px'; e.style.top = y.toFixed(1) + 'px';
  const r = $(id + '-r'), c = clicks.find(c => lt >= c && lt < c + .45);
  if (c != null) { const p = seg(lt, c, c + .45); r.style.opacity = (.75 * (1 - p)).toFixed(3); r.style.scale = (.4 + 1.3 * p).toFixed(3); } else r.style.opacity = 0;
  e.firstChild.style.scale = clicks.some(c => lt >= c - .07 && lt < c + .1) ? '.86' : '1';
}
const toastHTML = (id, text, top, action) => `<div class="toast" id="${id}" style="top:${top}px">${tchk()}<span id="${id}-t">${text}</span>${action ? `<span class="tact" id="${id}-a">${action}</span>` : ''}</div>`;
const toast = (id, lt, a, b) => show(id, lt, a, b, { dy: 18, sc: .92, d: .3 });
const MI_H = { item: 26, sep: 11, hdr: 22 };
function menuHTML(id, items, x, y, w = 250) {
  let h = '';
  items.forEach((it, i) => {
    if (it === '-') { h += '<div class="msep"></div>'; return; }
    if (it.hdr) { h += `<div class="mhdr">${it.hdr}</div>`; return; }
    h += `<div class="mit" id="${id}-i${i}"><span class="mchk">${it.chk ? '✓' : ''}</span><span class="mtt">${it.ic || ''}${it.t}</span>${it.k ? `<span class="mk">${it.k}</span>` : ''}${it.sub ? '<span class="msub">›</span>' : ''}</div>`;
  });
  return `<div class="menu" id="${id}" style="left:${x}px;top:${y}px;width:${w}px">${h}</div>`;
}
function menuY(items, i) { let y = 5; for (let j = 0; j < i; j++) { const it = items[j]; y += it === '-' ? MI_H.sep : it.hdr ? MI_H.hdr : MI_H.item; } return y + 13; }
function menuHover(id, items, idx) { items.forEach((it, i) => { if (it !== '-' && !it.hdr) cls(`${id}-i${i}`, 'hov', i === idx); }); }

// ---------------------------------------------------------------- scenes
const SCENES = [];
const scene = o => SCENES.push(o);
const CH = [

  { pill: 'Capture', word: 'Capture', eb: '⌃⌥4 · ⌃⌥T · ⌃⌥S', sub: 'Screenshots · text from the screen · scrolling capture' },
  { pill: 'Draw', word: 'Draw', eb: '⌃⌥D', sub: 'Ink on any screen' },
  { pill: 'Convert', word: 'Convert', eb: 'FINDER · MENU BAR', sub: 'PDFs, Office files and images, offline' },
  { pill: 'Share', word: 'Share', eb: 'SAME WI-FI', sub: 'Phones, laptops, LocalSend · Shelf' },
  { pill: 'Control', word: 'Control', eb: '⌃⌥M · ⌃⌥Q · ⌃⌥↩', sub: 'Windows · Caffeinate · Auto-Kill · palette · app hotkeys' },
];

// ===== Intro =====
scene({
  id: 'intro', len: 7.0,
  html: () => `<div id="in-all" style="position:absolute;inset:0">
    <div class="i-ring" id="in-ring"></div><img class="i-icon" id="in-icon" src="${ICON}" alt="">

  update(lt) {
    show('in-icon', lt, .1, null, { sc: .3, pop: true, d: .75 });
    $('in-icon').style.rotate = (lerp(-14, 0, out(seg(lt, .1, .9)))).toFixed(2) + 'deg';
    const r = seg(lt, .45, 1.7); op('in-ring', .7 * (1 - r) * (r > 0 ? 1 : 0)); $('in-ring').style.scale = (.85 + .7 * out(r)).toFixed(3);
    for (let i = 0; i < 6; i++) show('in-l' + i, lt, .8 + i * .06, null, { dy: 60, d: .45 });
    show('in-tag', lt, 1.75, null, { dy: 24, d: .45 });
    show('in-sub', lt, 2.15, null, { dy: 18, d: .45 });
    for (let i = 0; i < CH.length; i++) show('in-p' + i, lt, 2.7 + i * .09, null, { dy: 20, sc: .8, pop: true, d: .4 });
    const x = ease(seg(lt, 5.5, 6.3));
    S('in-all', { opacity: (1 - x).toFixed(3), scale: (1 - .05 * x).toFixed(4), translate: `0 ${(-30 * x).toFixed(1)}px` });
  },
});

// ===== Copy: clipboard history =====
const CLIP_A = [
  [I_TXT, 'npm run build'], [`<div style="width:28px;height:28px;background:#fff;display:flex;align-items:center;justify-content:center;font:800 6px -apple-system;color:#333">INVOICE</div>`, 'invoice-scan.png'],
  [I_TXT, 'Invoice #2041 — $1,280.00'], [I_LINK, 'https://trailhead.app/q4'], [I_TXT, 'Meeting moved to 3:30'],
  [fileIcon('PDF', FT.PDF, 18), 'Report.pdf'], [I_TXT, 'Thanks, see you Thursday!'],
];
const hrow = (id, r, i, badge) => `<div class="hr" id="${id}"><div class="hi">${r[0]}</div><div class="ht">${r[1]}</div>${badge ?? `<span class="hb">⌘${i + 1}</span>`}</div>`;
scene({
  id: 'clip', len: 7.2, ch: 0,
  cap: ['Everything you copied.', 'Search your history, even the words inside screenshots, and paste it back. <span class="kc">⌃⌥V</span>'],
  html: () => screen('clip', 'Mail', `
    ${win('clip-mail', 'New Message', 120, 70, 700, 560, `
      <div style="padding:6px 22px;font-size:15px;color:#77726a;border-bottom:1px solid #eee9df;line-height:34px">To: <span style="color:#1d1d1f;background:#efe8d8;border-radius:6px;padding:2px 8px">Priya Raman</span></div>
      <div style="padding:6px 22px;font-size:15px;color:#77726a;border-bottom:1px solid #eee9df;line-height:34px">Subject: <span style="color:#1d1d1f">October invoice</span></div>
      <div style="padding:22px;font-size:18px;line-height:1.6">Hi Priya,<br><br>Here’s the total for October:<br><span id="clip-paste" style="border-radius:5px;font-weight:600">Invoice #2041 — $1,280.00</span><span class="caret" id="clip-caret"></span><br><br>Thanks!<br>Sam</div>`)}
    <div class="pop" id="clip-pop">
      <div class="pl"><div class="ps">${MAG}<span id="clip-q"></span><span class="caret" style="height:16px"></span><span class="ph">⌘1…9</span></div>
        <div class="plist" id="clip-la">${CLIP_A.map((r, i) => hrow('clip-a' + i, r, i)).join('')}</div>
        <div class="plist" id="clip-lb">${[CLIP_A[1], CLIP_A[2]].map((r, i) => hrow('clip-b' + i, r, i)).join('')}</div></div>
      <div class="pdv"></div>
      <div class="pr">
        <div class="pv" id="clip-pa"><div class="pvh"><b>Text</b> 13 characters · Copied 2 min ago</div><div class="pvt mono" style="font-size:15px">npm run build</div></div>
        <div class="pv" id="clip-pb0"><div class="pvh"><b>Image</b> 1240 × 1754 · Copied yesterday</div>
          <div class="chk" style="height:330px;display:flex;align-items:center;justify-content:center">
            <div style="width:220px;height:300px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:22px 20px;font-size:11px;color:#444;rotate:-2deg">
              <div style="font-size:24px;font-weight:900;letter-spacing:1px;color:#1d1d1f"><span class="lt" id="clip-lt0">INVOICE</span></div>
              <div style="margin-top:6px">Trailhead Supply Co.</div>
              <div style="margin-top:16px;display:flex;justify-content:space-between"><span class="lt" id="clip-lt1">#2041</span><span>Oct 31, 2026</span></div>
              <div style="margin-top:18px;border-top:1px solid #ddd;padding-top:8px;display:flex;justify-content:space-between"><span>Trail boots ×2</span><span>$640.00</span></div>
              <div style="margin-top:6px;display:flex;justify-content:space-between"><span>Packs ×4</span><span>$640.00</span></div>
              <div style="margin-top:34px;display:flex;justify-content:space-between;font-size:13px;font-weight:800"><span>Total</span><span class="lt" id="clip-lt2">$1,280.00</span></div></div></div></div>
        <div class="pv" id="clip-pb1"><div class="pvh"><b>Text</b> 25 characters · Copied 4 min ago</div><div class="pvt">Invoice #2041 — $1,280.00</div></div>
        <div class="pf">↩ Paste · ⌥↩ Plain · ⌘P Pin · ⌘⌫ Delete</div></div></div>`),
  chords: [[.4, .85, ['⌃', '⌥', 'V']], [3.0, 3.25, ['↓']], [3.85, 4.1, ['↩']]],
  update(lt) {
    show('clip-pop', lt, .55, 3.95, { sc: .95, d: .25, scOut: .97 });
    txt('clip-q', type('invoice', lt, 1.1, 10));
    const f = seg(lt, 1.45, 1.7);
    op('clip-la', 1 - f); op('clip-lb', f); op('clip-pa', 1 - f);
    cls('clip-a0', 'sel', 1);
    const idx = lt < 3.05 ? 0 : 1;

  stage.appendChild(d); s.el = d;
}
$('nav-icon').src = ICON;
$('pills').insertAdjacentHTML('beforeend', CH.map((c, i) => `<span class="np${c.tt ? ' mono' : ''}" id="np${i}">${c.pill}</span>`).join(''));
const PILLS = CH.map((_, i) => $('np' + i));
$('iris').innerHTML = [[120, 160, 240], [1580, 700, 300], [300, 820, 120], [1700, 210, 90], [880, 950, 70], [60, 520, 60], [1380, 120, 50]].map(h => `<div class="h" style="left:${h[0]}px;top:${h[1]}px;width:${h[2]}px;height:${h[2]}px"></div>`).join('') + '<div id="iris-eb" class="mono"></div><div id="iris-word"></div><div id="iris-sub"></div>';
const BG = [[140, 220, 180], [1660, 260, 120], [1500, 880, 220], [120, 900, 90], [880, 980, 60], [1780, 620, 70], [40, 560, 46]];
$('bg').innerHTML = BG.map((b, i) => `<div class="bh" id="bh${i}" style="width:${b[2]}px;height:${b[2]}px"></div>`).join('');

// ---------------------------------------------------------------- per-frame
function chordUpdate(t) {
  let best = null, bv = 0;
  for (const s of SCENES) {
    if (!s.chords || s.el.style.display === 'none') continue;
    const lt = t - s.S - s.off;
    for (const c of s.chords) {
      const v = seg(lt, c[0] - .25, c[0] - .05) * (1 - seg(lt, c[1] + .15, c[1] + .4));
      if (v > bv) { bv = v; best = { c, lt }; }
    }
  }
  const el = $('chord');
  el.style.opacity = bv.toFixed(3);
  if (!best) return;
  const { c, lt } = best;
  htm('chord', c[2].map((k, i) => `<span class="ck${lt >= c[0] + i * .05 && lt < c[1] ? ' down' : ''}">${k}</span>`).join(''));
  el.style.translate = `0 ${(14 * (1 - out(bv))).toFixed(1)}px`;
}
function irisUpdate(t) {
  const iris = $('iris');
  const c = CHS.find(s => t >= s.S - .6 && t <= s.S + 1.05);
  if (!c) { iris.style.display = 'none'; return; }
  iris.style.display = 'block';
  const ch = CH[c.ch], pill = PILLS[c.ch].getBoundingClientRect();
  const cx = pill.left + pill.width / 2, cy = pill.top + pill.height / 2;
  iris.style.clipPath = `circle(${(2300 * ease(seg(t, c.S - .6, c.S - .05))).toFixed(1)}px at ${cx.toFixed(1)}px ${cy.toFixed(1)}px)`;
  const h = ease(seg(t, c.S + .45, c.S + 1.05)) * 1300;
  const m = h > 0 ? `radial-gradient(circle at 960px 540px, transparent ${h.toFixed(1)}px, #000 ${(h + 1).toFixed(1)}px)` : 'none';
  iris.style.webkitMaskImage = m; iris.style.maskImage = m;
  const w = $('iris-word');
  htm('iris-word', `${ch.word}<i></i>`); w.className = ch.tt ? 'tt' : '';
  txt('iris-eb', ch.eb); txt('iris-sub', ch.sub);
  const wp = out(seg(t, c.S - .4, c.S + .05));
  w.style.opacity = wp.toFixed(3);
  w.style.translate = `0 ${(70 * (1 - wp)).toFixed(1)}px`;
  w.style.scale = (1 + .22 * ease(seg(t, c.S + .45, c.S + 1.05))).toFixed(4);
  show('iris-eb', t, c.S - .3, null, { dy: 20, d: .3 });
  show('iris-sub', t, c.S - .2, null, { dy: 20, d: .3 });
}
function navUpdate(t) {
  const v = seg(t, INTRO.E - 1.2, INTRO.E - .6) * (1 - seg(t, UPD.S - .4, UPD.S));
  $('nav').style.opacity = v.toFixed(3);
  let k = -1;
  CHS.forEach((s, i) => { if (t >= s.S - .6) k = i; });
  const puck = $('puck');
  if (k < 0) { puck.style.opacity = 0; PILLS.forEach(p => p.classList.remove('on')); return; }
  const p = ease(seg(t, CHS[k].S - .6, CHS[k].S - .15));
  const a = PILLS[k > 0 ? k - 1 : k], b = PILLS[k];
  puck.style.left = lerp(a.offsetLeft, b.offsetLeft, p).toFixed(1) + 'px';
  puck.style.width = lerp(a.offsetWidth, b.offsetWidth, p).toFixed(1) + 'px';
  puck.style.opacity = (k > 0 ? 1 : p).toFixed(3);
  const on = p > .5 ? k : k - 1;
  PILLS.forEach((el, i) => el.classList.toggle('on', i === on));
}
function bgUpdate(t) {
  BG.forEach((b, i) => S('bh' + i, { left: (b[0] + 26 * Math.sin(t * .23 + i * 1.7)).toFixed(1) + 'px', top: (b[1] + 20 * Math.cos(t * .19 + i * 2.3)).toFixed(1) + 'px' }));
}
function wipeUpdate(t) {
  const w = $('wipe');
  const s = SCENES.find(s => s.wipe && t >= s.S - .1 && t <= s.S + .35);
  if (!s) { w.style.display = 'none'; return; }
  const p = ease(seg(t, s.S - .1, s.S + .35));
  w.style.display = p > 0 && p < 1 ? 'block' : 'none';
  w.style.left = ((1 - p) * 1920 - 9).toFixed(1) + 'px';
}

const DURATION = Math.ceil(LAST.E);
window.DURATION = DURATION;
window.seek = function (t) {
  bgUpdate(t);
  for (const s of SCENES) {
    const from = s === INTRO ? -9 : s.ch != null ? s.S - .05 : s.S - .1;
    const to = s === LAST ? 1e9 : s.E + .05;
    const vis = t >= from && t <= to;
    s.el.style.display = vis ? 'block' : 'none';
    if (!vis) continue;
    const lt = t - s.S - s.off;
    if (s.wipe) { const p = ease(seg(t, s.S - .1, s.S + .35)); s.el.style.clipPath = p >= 1 ? 'none' : `inset(0 0 0 ${((1 - p) * 100).toFixed(3)}%)`; }
    if (s.cap) show(s.id + '-cap', lt, .1, s.len - s.off - .5, { dy: 26, d: .35, dOut: .25 });
    s.update(lt, s);
  }
  irisUpdate(t); navUpdate(t); chordUpdate(t); wipeUpdate(t);
};
window.SCENE_TIMES = SCENES.map(s => [s.id, +s.S.toFixed(2), +s.E.toFixed(2)]);
window.seek(0);
</script>
</body>
